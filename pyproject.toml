[project]
name = "ganesh-trading"
version = "0.1.0"
description = "Backtest et paper trading de la stratégie Liquidity Sweep + VWAP sur QQQ"
requires-python = ">=3.12"
dependencies = [
  "pandas>=2.2",
  "numpy>=1.26",
  "vectorbt>=0.26",
  "yfinance>=0.2.40",
  "quantstats>=0.0.62",
  "pyyaml>=6",
  "alpaca-py>=0.30",
  "python-dotenv>=1",
  "plotly>=5.24,<6",
  "matplotlib>=3.8",
  "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["common", "strategy", "backtest", "live"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = [".claude", "frontend", "data", "outputs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
