server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Sorties du backtest et du live (volume ./outputs:/data:ro), jamais mises en cache par le navigateur.
    location /data/ {
        alias /data/;
        autoindex off;
        add_header Cache-Control "no-store" always;
        types { application/json json; text/csv csv; image/png png; text/html html; }
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
